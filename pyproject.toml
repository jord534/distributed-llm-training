[project]
name = "llm-train"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Jordan Bonil", email = "74353497+jord534@users.noreply.github.com" }
]
requires-python = ">=3.15.2"
dependencies = [
    "datasets>=5.1.0",
    "mistral-common>=1.13.0",
    "peft>=0.21.2",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.scripts]
llm-train = "llm_train:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"


# this section instructs to fetch CUDA versions of torch when on linux (ie on rented GPUs, not on my mac)
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"   
explicit = true                                    
[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
